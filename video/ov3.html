<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box} html,body{margin:0;width:1920px;height:1080px;background:transparent;font-family:"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;color:#f5f5f7;overflow:hidden}
.ph{position:absolute;left:240px;top:200px;width:1440px;height:810px;border:1px solid #2a2a2e;background:#0b0b0c;display:grid;place-items:center;text-align:center;font-size:36px;color:#86868b}
.ph small{display:block;font-size:20px;color:#86868b;margin-bottom:14px;letter-spacing:.18em}
.ch{position:absolute;left:120px;top:84px;font-size:68px;font-weight:400;letter-spacing:-.01em;text-shadow:0 2px 20px rgba(0,0,0,.9)}
.k2{position:absolute;left:123px;top:166px;font-size:22px;color:#86868b;letter-spacing:.05em}
.cl{position:absolute;right:120px;top:104px;font-size:20px;color:#a1a1a6;letter-spacing:.04em}
.sub{position:absolute;left:0;right:0;bottom:34px;text-align:center;padding:0 260px}
.sub p{margin:0;font-size:27px;line-height:1.6;font-weight:400;color:#d8d8dc;text-shadow:0 2px 12px #000}
.sub small{display:block;margin-top:6px;font-size:17px;color:#6e6f74}
</style></head><body><div id="r"></div><script>
const q=JSON.parse(decodeURIComponent(location.hash.slice(1)));
document.getElementById('r').innerHTML=(q.mode==='ph'?`<div class="ph"><div><small>撮る素材</small>${q.ph}</div></div>`:'')
+(q.mode==='ov'?(q.key?`<div class="ch">${q.key}</div>`:'')+(q.key2?`<div class="k2">${q.key2}</div>`:'')+(q.claude?`<div class="cl">${q.claude}</div>`:'')+`<div class="sub"><p>${q.say}</p>${q.note?`<small>${q.note}</small>`:''}</div>`:'');
</script></body></html>
