<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* 作り手の数（約 8 秒）：11.5 万人 → 4.8 万人と数が減っていき、棒が縮む。そのあと年齢の内わけ */
.big{position:absolute;left:120px;top:300px}
.big .n{font-size:220px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.big .u{font-size:48px;font-weight:300;margin-left:16px}
.big .y{display:block;margin-top:18px;font-size:24px;color:#86868b}
.bar{position:absolute;left:120px;top:690px;height:14px;background:#f5f5f7;border-radius:7px;width:1440px}
.bar0{position:absolute;left:120px;top:690px;height:14px;background:#2c2c2e;border-radius:7px;width:1440px}
.age{position:absolute;left:1120px;top:330px;opacity:0;animation:fade .6s ease 5.4s forwards}
.age .r{display:flex;align-items:baseline;gap:18px;margin-bottom:14px}.age b{font-size:64px;font-weight:300;width:220px;text-align:right;font-variant-numeric:tabular-nums}.age span{font-size:22px;color:#86868b}
.age .hot b{color:#ff6961}
.src{position:absolute;left:120px;right:120px;top:auto;bottom:70px;text-align:left}
</style>
<div class="big"><span class="n" id="n">11.5</span><span class="u">万人</span><span class="y" id="y">伝統的工芸品の従業員数　1998 年度</span></div>
<div class="bar0"></div><div class="bar" id="bar"></div>
<div class="age"><div class="r hot"><b>18.0%</b><span>70 歳代以上</span></div><div class="r"><b>6.0%</b><span>20 歳代まで</span></div></div>
<div class="src">出典：経済産業省 説明資料（伝統的工芸品産業振興協会の集計データより作成、令和 8 年 7 月）。年齢は令和 4 年度</div>
<script>const t0=performance.now();const n=document.getElementById('n'),y=document.getElementById('y'),bar=document.getElementById('bar');
const tick=()=>{const t=(performance.now()-t0)/1000;const u=Math.min(1,Math.max(0,(t-1.0)/3));const e=u*u*(3-2*u);const v=11.5+(4.8-11.5)*e;n.textContent=v.toFixed(1);bar.style.width=(1440*v/11.5)+'px';y.textContent=u<1?'伝統的工芸品の従業員数　'+Math.round(1998+24*e)+' 年度':'伝統的工芸品の従業員数　2022 年度　24 年で、約 6 割減';requestAnimationFrame(tick)};requestAnimationFrame(tick);</script>
