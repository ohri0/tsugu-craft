<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
/* 形だけでなく（12 秒）。見出しは字幕の側（ov3）が出す。

.t1{position:absolute;inset:0;animation:out .6s ease 6.6s forwards}
.tb{position:absolute;left:300px;right:300px;top:330px;display:grid;grid-template-columns:1.4fr 1fr 1fr;row-gap:0}
.tb div{padding:26px 0;border-bottom:1px solid #2c2c2e;font-size:34px;opacity:0;animation:in .5s ease forwards}
.tb .h{font-size:15px;padding:0 0 18px;letter-spacing:.18em;text-transform:uppercase;color:#6e6e73}
.tb .c{text-align:center}
.yes{color:#f5f5f7}.no{color:#ff6961}
.tb .k{animation-delay:3.6s!important}
.k.yes{color:#f5f5f7}
.t2{position:absolute;inset:0;opacity:0;animation:fade .8s ease 7s forwards}
.a{position:absolute;left:120px;top:360px;width:1000px}
.chip{display:inline-block;margin:0 12px 14px 0;padding:10px 20px;border:1px solid #3a3a3c;border-radius:999px;font-size:22px;color:#d2d2d7;opacity:0;animation:in .35s ease forwards}
.chip i{font-style:normal;color:#6e6e73;margin-right:10px}
.b{position:absolute;left:1260px;top:440px;width:540px;opacity:0;animation:in .8s ease 8.8s forwards}
.b .lab{display:block}
.b b{display:block;margin-top:14px;font-size:46px;font-weight:400}
.b span{display:block;margin-top:14px;font-size:22px;color:#86868b;line-height:1.6}
</style>
<div class="t1">
<div class="tb">
<div class="h" style="animation-delay:.2s">残したいもの</div><div class="h c" style="animation-delay:.2s">CAD のデータ</div><div class="h c" style="animation-delay:3.4s">継ぐ</div>
<div style="animation-delay:.5s">形</div><div class="c yes" style="animation-delay:.9s">残る</div><div class="c k yes">残る</div>
<div style="animation-delay:1.3s">なぜ、その形か</div><div class="c no" style="animation-delay:1.7s">残らない</div><div class="c k yes">残る</div>
<div style="animation-delay:2.1s">どう作るか</div><div class="c no" style="animation-delay:2.5s">残らない</div><div class="c k yes">残る</div>
</div>
</div>
<div class="t2">
<div class="a"><span class="lab" style="display:block;margin-bottom:26px">もし、受け継ぎが途切れても　残っている手がかり（はじめの題材：木目金）</span>
<span class="chip" style="animation-delay:7.2s"><i>C1</i>表面の模様</span><span class="chip" style="animation-delay:7.3s"><i>C3</i>縁に見える層</span><span class="chip" style="animation-delay:7.4s"><i>C7</i>黒くなる銅の合金</span><span class="chip" style="animation-delay:7.5s"><i>C8</i>銀と銅の合金</span><span class="chip" style="animation-delay:7.6s"><i>C10</i>煮て色を出す</span><span class="chip" style="animation-delay:7.7s"><i>C12</i>江戸時代と刀の金具</span><span class="chip" style="animation-delay:7.8s"><i>C16</i>彫りと打ち出しの道具</span><span class="chip" style="animation-delay:7.9s"><i>C17</i>火床と木炭</span><span class="chip" style="animation-delay:8.0s"><i>…</i>ほか 12</span>
</div>
<div class="b"><span class="lab">Claude</span><b>作り方を、組み立て直す</b><span>工程ごとに、どの手がかりから考えたかを残す</span></div>
</div>
